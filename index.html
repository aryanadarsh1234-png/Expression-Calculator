<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Web Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 20px;
  }
  .calculator {
    background: #1c1c1e;
    border-radius: 30px;
    padding: 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    width: 100%;
    max-width: 380px;
  }
  .title {
    color: #8e8e93;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-align: right;
  }
  .expression {
    color: #636366;
    font-size: 18px;
    text-align: right;
    min-height: 22px;
    padding: 0 10px 8px;
    font-weight: 300;
    word-break: break-all;
  }
  .display {
    color: #fff;
    font-size: 52px;
    font-weight: 200;
    text-align: right;
    padding: 10px 10px 20px;
    min-height: 90px;
    word-break: break-all;
    line-height: 1.1;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 10px;
  }
  button {
    height: 64px;
    border: none;
    border-radius: 50%;
    font-size: 24px;
    font-weight: 400;
    cursor: pointer;
    color: #fff;
    transition: transform 0.08s ease, filter 0.15s ease;
    font-family: inherit;
    user-select: none;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(0.94); }
  .num { background: #333336; }
  .fn { background: #a5a5a5; color: #000; font-weight: 500; }
  .op { background: #ff9f0a; font-weight: 500; box-shadow: 0 4px 12px rgba(255,159,10,0.3); }
  .paren { background: #4a4a4d; font-weight: 500; }
  .equals { background: #ff9f0a; box-shadow: 0 4px 12px rgba(255,159,10,0.3); }
  .footer {
    margin-top: 20px;
    text-align: center;
    color: #48484a;
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="calculator">
    <div class="title">Calculator</div>
    <div class="expression" id="expression">&nbsp;</div>
    <div class="display" id="display">0</div>
    <div class="grid">
      <button class="fn" data-action="clear">AC</button>
      <button class="paren" data-token="(">(</button>
      <button class="paren" data-token=")">)</button>
      <button class="op" data-token="/">÷</button>

      <button class="num" data-token="7">7</button>
      <button class="num" data-token="8">8</button>
      <button class="num" data-token="9">9</button>
      <button class="op" data-token="*">×</button>

      <button class="num" data-token="4">4</button>
      <button class="num" data-token="5">5</button>
      <button class="num" data-token="6">6</button>
      <button class="op" data-token="-">−</button>

      <button class="num" data-token="1">1</button>
      <button class="num" data-token="2">2</button>
      <button class="num" data-token="3">3</button>
      <button class="op" data-token="+">+</button>

      <button class="fn" data-action="back">⌫</button>
      <button class="num" data-token="0">0</button>
      <button class="num" data-token=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

<script>
  const displayEl = document.getElementById('display');
  const exprEl = document.getElementById('expression');

  let expr = '';
  let justEvaluated = false;

  const OPERATORS = ['+', '-', '*', '/'];

  function pretty(s) {
    return s
      .replace(/\*/g, '×')
      .replace(/\//g, '÷')
      .replace(/-/g, '−');
  }

  function render(result) {
    exprEl.textContent = expr ? pretty(expr) : '\u00A0';
    displayEl.textContent = result !== undefined ? result : (expr ? pretty(lastNumber(expr) || expr) : '0');
  }

  function lastNumber(s) {
    const m = s.match(/(\d+\.?\d*|\.\d+)$/);
    return m ? m[0] : '';
  }

  function lastChar() { return expr.slice(-1); }

  function openParens() {
    let n = 0;
    for (const c of expr) { if (c === '(') n++; else if (c === ')') n--; }
    return n;
  }

  function appendToken(t) {
    if (justEvaluated) {
      if (OPERATORS.includes(t) || t === ')') {
        // keep result as start of new expression
      } else {
        expr = '';
      }
      justEvaluated = false;
    }

    const last = lastChar();

    if (OPERATORS.includes(t)) {
      if (expr === '' && t !== '-') return;
      if (OPERATORS.includes(last)) { expr = expr.slice(0, -1) + t; render(); return; }
      if (last === '(' && t !== '-') return;
    }

    if (t === '.') {
      const ln = lastNumber(expr);
      if (ln.includes('.')) return;
      if (ln === '') expr += '0';
    }

    if (t === '(') {
      if (/[\d.)]/.test(last)) expr += '*';
    }

    if (t === ')') {
      if (openParens() <= 0) return;
      if (last === '' || last === '(' || OPERATORS.includes(last)) return;
    }

    if (/\d/.test(t) && last === ')') expr += '*';

    expr += t;
    render();
  }

  function backspace() {
    if (justEvaluated) { expr = ''; justEvaluated = false; render(); return; }
    expr = expr.slice(0, -1);
    render();
  }

  function clearAll() { expr = ''; justEvaluated = false; render(); }

  function evaluate() {
    if (!expr) return;
    let e = expr;
    const open = openParens();
    if (open > 0) e += ')'.repeat(open);
    while (OPERATORS.includes(e.slice(-1))) e = e.slice(0, -1);
    if (!/^[\d+\-*/().\s]+$/.test(e)) { displayEl.textContent = 'Error'; return; }
    try {
      const r = Function(`"use strict"; return (${e});`)();
      if (!isFinite(r)) { displayEl.textContent = 'Error'; expr = ''; return; }
      const rounded = Number(Number(r).toPrecision(12)).toString();
      expr = rounded;
      justEvaluated = true;
      render(pretty(rounded));
    } catch {
      displayEl.textContent = 'Error';
    }
  }

  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.token !== undefined) appendToken(btn.dataset.token);
      else if (btn.dataset.action === 'equals') evaluate();
      else if (btn.dataset.action === 'clear') clearAll();
      else if (btn.dataset.action === 'back') backspace();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (/[0-9.]/.test(e.key)) appendToken(e.key);
    else if (['+', '-', '*', '/', '(', ')'].includes(e.key)) appendToken(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); evaluate(); }
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') backspace();
  });

  render();
</script>
</body>
</html>
